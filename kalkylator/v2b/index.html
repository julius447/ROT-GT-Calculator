<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Räkna ut ditt ROT-avdrag: Ampy</title>
<meta name="description" content="Tre frågor. Ditt avdrag 2026, räknat på din inkomst.">
<link rel="stylesheet" href="../system/ampy.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body class="ampy">
<main class="rk-main">
  <section class="rk" id="avdragskollen" aria-labelledby="rk-h2" data-mode="rot" data-status="tak">
    <h2 class="ampy-h2 rk__h2" id="rk-h2">Räkna ut ditt ROT-avdrag</h2>

    <div class="ampy-card rk__card">
      <form class="rk__fragor" novalidate autocomplete="off">

        <div class="rk__q">
          <p class="rk__fraga" id="rk-q1">Äger du din bostad?</p>
          <p class="rk__under" id="rk-q1-under"><span>Villa, radhus eller lägenhet.</span> <span>Helt eller delvis.</span></p>
          <div class="rk__kontroll">
            <div class="ampy-segment rk__seg" role="radiogroup" aria-labelledby="rk-q1" aria-describedby="rk-q1-under">
              <label><input type="radio" name="ager" value="ja" checked><span>Ja</span></label>
              <label><input type="radio" name="ager" value="nej"><span>Nej</span></label>
            </div>
          </div>
        </div>

        <div class="rk__q rk__q--femar" id="rk-q2-block">
          <p class="rk__fraga" id="rk-q2">Är bostaden äldre än fem år?</p>
          <div class="rk__kontroll">
            <div class="ampy-segment rk__seg" role="radiogroup" aria-labelledby="rk-q2">
              <label><input type="radio" name="aldre" value="ja" checked><span>Ja</span></label>
              <label><input type="radio" name="aldre" value="nej"><span>Nej</span></label>
            </div>
          </div>
        </div>

        <div class="rk__q rk__q--inkomst">
          <p class="rk__fraga" id="rk-q3">Din inkomst förra året</p>
          <div class="rk__inkomst rk__kontroll">
            <div class="ampy-segment rk__seg" role="radiogroup" aria-labelledby="rk-q3">
              <label><input type="radio" name="typ" value="lon" checked><span>Lön</span></label>
              <label><input type="radio" name="typ" value="pension"><span>Pension</span></label>
            </div>
            <div class="rk__falt">
              <input class="ampy-input rk__input" id="rk-inkomst" type="text" inputmode="numeric" enterkeyhint="done" placeholder="300 000" aria-labelledby="rk-q3" aria-describedby="rk-kr">
              <span class="rk__kr" id="rk-kr" aria-hidden="true">kr</span>
            </div>
          </div>
        </div>

      </form>

      <div class="rk__band">
        <p class="ampy-eyebrow rk__etikett" id="rk-etikett">Ditt ROT-avdrag 2026</p>
        <div class="rk__varde" aria-live="polite" aria-atomic="true">
          <div class="rk__utfall" id="rk-utfall">
            <p class="rk__tal" id="rk-tal"><span class="rk__prefix" id="rk-prefix">upp till</span> <span class="rk__num" id="rk-num">50 000</span> <span class="rk__enhet" id="rk-enhet">kr</span></p>
            <p class="rk__sub" id="rk-per">Per person och år.</p>
            <p class="rk__not" id="rk-not"></p>
          </div>
          <div class="rk__stopp is-dold" id="rk-stopp" aria-hidden="true">
            <svg class="rk__x" viewBox="0 0 44 44" width="44" height="44" aria-hidden="true" focusable="false">
              <circle cx="22" cy="22" r="22" fill="currentColor"/>
              <path d="M15.5 15.5l13 13M28.5 15.5l-13 13" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round"/>
            </svg>
            <p class="rk__stopp-text" id="rk-stopp-text"></p>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
